# Builds the Linux and Windows zips.
#   - Push a tag like v0.1.0:  tests, builds, and publishes a GitHub release with both zips attached.
#   - Run it by hand (Actions tab, "Run workflow"): tests and builds, and keeps the zips as a downloadable artifact.
# Godot and its export templates come straight from the official godot-builds releases, checked against its SHA-512 sums.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

env:
  GODOT_VERSION: "4.7.2"   # keep in step with the Godot you build with locally

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and the export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSLO "$base/$editor.zip"
          curl -fsSLO "$base/$templates"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep -E "  ($editor\.zip|$templates)\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$editor.zip"
          sudo install -m 755 "$editor" /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" tpl
          unzip -q "$templates" -d tpl
          mv tpl/templates/* "$dest/"
          godot --version

      - name: Import the project
        run: godot --headless --path . --import || true   # the first import of a fresh checkout can print font warnings

      - name: Room check and full playthrough (a broken game fails the build)
        run: |
          godot --headless --path . -s tools/check_rooms.gd
          godot --headless --path . -s tools/playthrough.gd

      - name: Build the Linux and Windows zips
        run: VERSION="${GITHUB_REF_NAME}" ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: code-primates-${{ github.ref_name }}
          path: build/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "Code Primates $GITHUB_REF_NAME" --generate-notes
